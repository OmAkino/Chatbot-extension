<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f9f9f9;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .chatbot-header {
      background: #5c6bc0;
      color: white;
      padding: 10px 15px;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      display: flex;
      flex-direction: column;
    }
    
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }
    
    .url-display {
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      opacity: 0.8;
    }
    
    .minimize-button {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px 5px;
      margin-left: 10px;
      border-radius: 3px;
    }
    
    .minimize-button:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    
    .model-selector {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .model-selector select {
      padding: 4px;
      border: none;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 12px;
    }
    
    .chatbot-messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .message {
      padding: 10px;
      border-radius: 8px;
      max-width: 80%;
      word-wrap: break-word;
    }
    
    .user-message {
      background: #e2e8ff;
      align-self: flex-end;
    }
    
    .ai-message {
      background: #f1f1f1;
      align-self: flex-start;
    }
    
    .thinking {
      align-self: flex-start;
      font-style: italic;
      color: #777;
      padding: 5px 10px;
    }
    
    .chatbot-input {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ddd;
      background: white;
    }
    
    #messageInput {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 20px;
      padding: 8px 15px;
      margin-right: 10px;
      outline: none;
    }
    
    #sendButton {
      background: #5c6bc0;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 8px 15px;
      cursor: pointer;
    }
    
    #sendButton:hover {
      background: #4a59a7;
    }
    
    .code-block {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 5px;
      font-family: monospace;
      white-space: pre-wrap;
      margin: 10px 0;
      border-left: 3px solid #5c6bc0;
      overflow-x: auto;
    }
    
    a {
      color: #5c6bc0;
      text-decoration: none;
    }
    
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="chatbot-header">
    <div class="header-top">
      <div class="url-display" id="urlDisplay">Loading...</div>
      <button class="minimize-button" id="minimizeButton" title="Minimize">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>
    <div class="model-selector">
      <span>AI Model:</span>
      <select id="modelSelect">
        <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
        <option value="gpt-4">GPT-4</option>
        <option value="claude-2">Claude 2</option>
        <option value="custom">Custom</option>
      </select>
    </div>
  </div>
  
  <div class="chatbot-messages" id="messagesContainer">
    <div class="message ai-message">
      Hello! I'm your AI assistant. How can I help you today?
    </div>
  </div>
  
  <div class="chatbot-input">
    <input type="text" id="messageInput" placeholder="Type your message...">
    <button id="sendButton">Send</button>
  </div>
  
  <script src="chatbot.js"></script>
</body>
</html>
